[project]
name = "agent-memory"
version = "0.0.1"
description = "Semantic memory framework for agent developers"
readme = "README.md"
authors = [
    { name = "Von", email = "haodong.lu.me@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.2.0",
    "lotus-ai==1.1.4",
    "nltk>=3.9.1",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
benchmarks = [
  "editdistance>=0.8.1",
  "pyarrow>=18.0.0",
  "tiktoken>=0.8.0",
]
zep = [
    "neo4j==6.1.0",
    "sentence-transformers==3.4.1",
]
mem0 = [
    "qdrant-client==1.12.1",
    "sentence-transformers==3.4.1",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
    "notebook>=7.5.6",
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "ruff>=0.15.22",
]

[tool.ruff]
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
include = [
    "src/agent_memory/evaluation/agent_memory_drivers.py",
    "src/agent_memory/evaluation/artifacts.py",
    "src/agent_memory/evaluation/bundle.py",
    "src/agent_memory/evaluation/comparison.py",
    "src/agent_memory/evaluation/harness.py",
    "src/agent_memory/evaluation/longmemeval",
    "src/agent_memory/evaluation/locomo.py",
    "src/agent_memory/evaluation/locomo_contracts.py",
    "src/agent_memory/evaluation/memory_agent_bench",
    "src/agent_memory/evaluation/metrics.py",
    "src/agent_memory/evaluation/models.py",
    "src/agent_memory/evaluation/pricing.py",
    "src/agent_memory/evaluation/provenance.py",
    "src/agent_memory/evaluation/run.py",
    "src/agent_memory/evaluation/trace_metrics.py",
    "src/agent_memory/evaluation/types.py",
    "src/agent_memory/evaluation/zep/artifacts.py",
    "tests/test_agent_memory_benchmark_drivers.py",
    "tests/test_benchmark_bundle.py",
    "tests/test_benchmark_cli.py",
    "tests/test_benchmark_comparison.py",
    "tests/test_benchmark_harness.py",
    "tests/test_benchmark_model.py",
    "tests/test_benchmark_trace_metrics.py",
    "tests/test_longmemeval_benchmark.py",
    "tests/test_mem0_benchmark_integration.py",
    "tests/test_memory_agent_bench.py",
    "tools/evaluation/compare_memory_systems.py",
    "tools/evaluation/longmemeval.py",
    "tools/evaluation/locomo.py",
    "tools/evaluation/memory_agent_bench.py",
    "tools/analysis/semantic_pair_candidates.py",
    "tests/test_semantic_pair_candidates.py",
]
