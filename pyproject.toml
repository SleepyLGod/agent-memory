[project]
name = "agent-memory"
version = "0.0.1"
description = "Semantic memory framework for agent developers"
readme = "README.md"
authors = [
    { name = "Von", email = "haodong.lu.me@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dspy>=3.2.0",
    "lotus-ai>=1.1.4",
    "nltk>=3.9.1",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
zep = [
    "neo4j>=5.26,<7",
    "sentence-transformers==3.4.1",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
    "notebook>=7.5.6",
    "pytest>=9.0.3",
]
